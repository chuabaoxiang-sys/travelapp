<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4C1D95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="旅记 · 家庭旅行行程与账目记录" />
    <title>旅记 · TripJournal</title>
    <script>
      // 在任何CSS生效之前先把主题定下来，不然会先闪一下默认主题再跳到用户实际选的
      // 那个（深色模式下尤其明显）。跟 src/lib/theme.ts 用同一个 localStorage key、
      // 同一套取值规则，这里必须是内联同步脚本，用 import 引入模块反而会晚一步
      try {
        var t = localStorage.getItem('trip-journal:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
